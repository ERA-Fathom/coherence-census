name: census
on: [push, pull_request, workflow_dispatch]
jobs:
  rows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "fathom-read>=0.1.1"
      - run: python scripts/build.py --check
